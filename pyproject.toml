[project]
name = "opencost"
version = "0.1.1"
description = "Pydantic models for the openCost publication-cost metadata schema, with XML de-/serialization"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [
    { name = "Sven Marcus", email = "s.marcus@tu-braunschweig.de" },
    { name = "Sergej Wildemann", email = "s.wildemann@tu-braunschweig.de" }
]
keywords = ["openCost", "scholarly publishing", "APC", "metadata", "pydantic", "XML"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

dependencies = ["pydantic>=2.10"]

[dependency-groups]
# runtime requirements of the test suite; consumed by both `dev` and the
# nox test/checker sessions (see noxfile.py)
test = [
    "lxml>=5.0",
    "lxml-stubs>=0.5.1",
    "pytest>=8.0",
]
dev = [
    { include-group = "test" },
    "mypy>=1.14",
    "nox>=2026.8.17",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/opencost/__init__.py" = ["I001", "RUF022"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["opencost"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["tests"]
typeCheckingMode = "strict"

[tool.pyrefly]
# Presence of this table switches Pyrefly off its toothless `basic` preset.
# One checker (mypy) polices src/; the multi-checker sessions focus on tests/,
# i.e. the public API as users call it.
project-includes = ["tests"]
search_path = ["tests"]
