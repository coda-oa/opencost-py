name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the openCost schema submodule drives the XSD validation tests;
          # without it those tests skip silently
          submodules: true

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Guard schema submodule present
        # the XSD validation tests skip when vendor/opencost is absent;
        # in CI that would be a silent coverage loss -> fail loudly
        run: test -f vendor/opencost/doc/opencost.xsd

      - name: ruff check
        run: uv run ruff check .

      - name: test + type check via nox (pytest; mypy on src; mypy, pyright, pyrefly on tests)
        # nox builds isolated uv venvs per session; wheels come from the
        # uv cache warmed by the sync above
        run: uv run --frozen nox
